name: TownyDragonEvent
version: ${project.version}
main: net.townysmp.dragonevent.TownyDragonEventPlugin
api-version: '1.21'
author: TownySMP
description: Isolated Ender Dragon events with a vanilla respawn sequence.
website: https://github.com/HZcgc/TownyDragonEvent
softdepend: [PlaceholderAPI]
commands:
  dragon:
    description: TownySMP Dragon Event
    usage: /dragon <join|leave|status|stats|start [normal|april_fools|april fools] [seconds]|stop|reload|setspawn|setportal|setexit|season>
permissions:
  townysmp.dragon.join:
    default: true
  townysmp.dragon.admin:
    default: op
  townysmp.dragon.build:
    description: Bypass event.block-building inside the Dragon arena
    default: op
