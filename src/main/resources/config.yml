world:
  # Both folders are relative to the server world-container.
  # Set a custom template folder here. Leave it empty to clone the server's
  # vanilla End instead. The source world itself is never modified.
  template-folder: ''
  vanilla-end-folder: world_the_end
  runtime-name: dragonevent_end
  join-location: { x: 0.5, y: 65.0, z: 18.5, yaw: 180.0, pitch: 0.0 }
  fallback-command: spawn {player}
event:
  join-seconds: 300
  finish-delay-seconds: 20
  dragon-health: 1000.0
  minimum-players: 1
  one-account-per-ip: true
  block-building: true
rewards:
  participation:
    - eco give {player} 500
  rank-1:
    - eco give {player} 5000
  rank-2:
    - eco give {player} 3000
  rank-3:
    - eco give {player} 2000
