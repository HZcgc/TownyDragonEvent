config-version: 4
world:
  template-folder: ''
  auto-template-name: dragonevent_template
  vanilla-end-folder: world_the_end
  runtime-name: dragonevent_end
  locator-bar-enabled: false
  join-location:
    x: 0.5
    y: 65.0
    z: 18.5
    yaw: 180.0
    pitch: 0.0
  portal-location:
    set: false
    x: 0
    y: 64
    z: 0
  exit-location:
    world: ''
    x: 0.0
    y: 64.0
    z: 0.0
    yaw: 0.0
    pitch: 0.0
  spectator-location:
    x: 0.5
    y: 100.0
    z: 0.5
    yaw: 0.0
    pitch: 45.0
  spectator-boundary:
    min-y: 0.0
    max-y: 220.0
    check-interval-ticks: 5
  border:
    enabled: true
    center-on-portal: true
    center-x: 0.0
    center-z: 0.0
    size: 512.0
    warning-distance: 16
  protect-vanilla-portal-during-copy: true
  reset:
    maximum-unload-attempts: 40
    retry-delay-ticks: 10
event:
  countdown-seconds: 10800
  join-seconds: 300
  finish-delay-seconds: 120
  dragon-health: 5000.0
  fight-time-limit-seconds: 1800
  minimum-players: 1
  block-building: true
  disconnect-grace-seconds: 60
  player-state:
    force-survival: true
    disable-flight: true
  difficulty-scaling:
    enabled: true
    health-per-additional-fighter: 1500.0
    maximum-effective-health: 40000.0
    attack-multiplier-per-additional-fighter: 0.05
    maximum-attack-multiplier: 2.0
    projectiles:
      additional-every-fighters: 8
      maximum-per-volley: 3
      spread-degrees: 10.0
  arena-destruction:
    enabled: true
    dragon-griefing: true
    force-explosions: true
    limits:
      maximum-primed-tnt: 64
      maximum-april-projectiles: 64
    explosion-power:
      player-tnt: 4.0
      april-tnt: 5.0
      april-fireball: 3.0
  safe-respawn:
    enabled: true
    platform-radius: 2
    platform-material: OBSIDIAN
  safe-exit:
    rebuild-vanilla-portal: true
    platform:
      enabled: true
      radius: 9
  dragon-watchdog:
    enabled: true
    minimum-y: -20.0
    maximum-y: 300.0
    minimum-movement-blocks: 2.0
    maximum-stationary-seconds: 25
    rescue-height-offset: 70.0
  fight-actionbar:
    enabled: true
  minimum-reward-damage: 25.0
  lock-exit-until-victory: true
  death:
    keep-inventory: true
    immediate-respawn: true
    respawn-protection-seconds: 5
    slow-falling-seconds: 8
    spectator-after-deaths: 5
    respawn-commands: []
  void-rescue:
    enabled: true
    trigger-y: -10.0
    cooldown-seconds: 10
    slow-falling-seconds: 8
  announcement-seconds:
  - 10800
  - 7200
  - 3600
  - 1800
  - 900
  - 600
  - 300
  last-chance-seconds: 180
  final-countdown-seconds:
  - 30
  - 15
  - 10
  - 5
  - 4
  - 3
  - 2
  - 1
  mode-chances:
    april-fools: 0.05
    freddie: 0.05
  enrage:
    enabled: true
    health-threshold: 0.25
    attack-multiplier: 1.2
    special-barrage-interval-ticks: 15
    additional-projectiles: 1
notifications:
  announcement:
    sound: minecraft:entity.ender_dragon.ambient
    volume: 0.35
    pitch: 0.9
    title: false
  last-chance:
    sound: minecraft:entity.ender_dragon.growl
    volume: 0.55
    pitch: 0.85
    title: false
  countdown:
    sound: minecraft:block.note_block.pling
    volume: 0.45
    pitch: 0.8
    title: false
    fade-in-ticks: 10
    stay-ticks: 40
    fade-out-ticks: 10
  lobby:
    sound: minecraft:block.end_portal.spawn
    volume: 0.8
    pitch: 1.0
    title: true
  respawn:
    sound: minecraft:entity.ender_dragon.growl
    volume: 1.0
    pitch: 0.7
    title: true
  fight:
    sound: minecraft:entity.ender_dragon.growl
    volume: 1.0
    pitch: 1.0
    title: true
  april-fight:
    sounds:
    - minecraft:entity.creeper.primed;1.0;0.7
    - minecraft:entity.ghast.scream;0.8;1.2
    title: true
  victory:
    sound: minecraft:ui.toast.challenge_complete
    volume: 1.0
    pitch: 1.0
    title: true
  defeat:
    sound: minecraft:entity.ender_dragon.growl
    volume: 1.0
    pitch: 0.6
    title: true
  difficulty:
    sound: minecraft:block.beacon.power_select
    volume: 0.5
    pitch: 1.2
    title: false
  freddie-fight:
    sounds:
    - minecraft:entity.frog.ambient;1.3;0.75
    - minecraft:entity.frog.tongue;1.0;0.6
    title: true
april-fools:
  health-multiplier: 2.0
  creeper-scale: 6.0
  vertical-offset: -4.0
  carrier:
    maximum-height-above-portal: 65.0
    rescue-height-above-portal: 45.0
  projectiles:
    tnt-chance: 0.9
    speed: 1.25
    tnt-fuse-ticks: 45
    fireball-yield: 2.0
    dragon-shot-multiplier: 5
    maximum-per-dragon-shot: 15
    portal-cease-fire:
      enabled: true
      radius: 18.0
      maximum-height-above-portal: 16.0
    automatic-barrage:
      enabled: true
      interval-ticks: 20
      projectiles: 8
      spread-degrees: 12.0
  sounds:
    enabled: true
    creeper-voice-enabled: false
    global-to-arena: true
    ambient:
      sound: minecraft:entity.creeper.hurt
      interval-ticks: 80
      volume: 1.8
      pitch: 0.55
    attack:
      sound: minecraft:entity.creeper.primed
      volume: 2.4
      pitch: 0.65
    hurt:
      sound: minecraft:entity.creeper.hurt
      cooldown-ticks: 6
      volume: 1.6
      pitch: 0.75
  finale:
    enabled: true
    mini-creepers: 10
    mini-creeper-scale: 0.45
    mini-fuse-ticks: 40
    fireworks: 6
victory-fireworks:
  enabled: true
  waves: 4
  fireworks-per-wave: 5
  interval-ticks: 12
  power: 1
rewards:
  policy:
    rank-replaces-other-rewards: true
    highest-damage-tier-only: true
  participation:
  - eco give {player} 500
  late-participation:
  - eco give {player} 250
  no-death:
  - eco give {player} 500
  rank-1:
  - eco give {player} 5000
  - cratekey give {player} dragon 3
  rank-2:
  - eco give {player} 3000
  - cratekey give {player} dragon 2
  rank-3:
  - eco give {player} 2000
  - cratekey give {player} dragon 1
  event-end: []
  damage-tiers:
    '100':
    - eco give {player} 250
    '250':
    - eco give {player} 500
    '500':
    - eco give {player} 1000
statistics:
  season: season-1
freddie:
  health-multiplier: 2.0
  vertical-offset: -1.0
  carrier:
    maximum-height-above-portal: 65.0
    rescue-height-above-portal: 45.0
  projectiles:
    tnt-chance: 0.9
    speed: 1.25
    tnt-fuse-ticks: 45
    fireball-yield: 2.0
    dragon-shot-multiplier: 5
    maximum-per-dragon-shot: 15
    portal-cease-fire:
      enabled: true
      radius: 18.0
      maximum-height-above-portal: 16.0
    automatic-barrage:
      enabled: true
      interval-ticks: 20
      projectiles: 8
      spread-degrees: 12.0
  sounds:
    enabled: true
    global-to-arena: true
    ambient:
      sound: minecraft:entity.frog.ambient
      interval-ticks: 120
      volume: 1.2
      pitch: 0.8
    attack:
      sound: minecraft:entity.frog.tongue
      volume: 1.3
      pitch: 0.7
    hurt:
      sound: minecraft:entity.frog.hurt
      cooldown-ticks: 6
      volume: 1.0
      pitch: 0.8
    voice-enabled: true
  finale:
    enabled: true
    fireworks: 6
    mini-frogs: 10
  frog-scale: 8.0
displays:
  lobby-countdown: true
  lobby-actionbar: true
  portal-leaderboards: true
  portal-radius: 3.0
  distance-from-portal: 10.5
  height: 4.5
  view-distance: 64.0
