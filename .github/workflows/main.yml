name: Build TownyDragonEvent

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Build and verify
        run: mvn -B clean verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: TownyDragonEvent-build30-Paper-26.2
          path: target/TownyDragonEvent-0.1.0-build30.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-build30
          JAR: target/TownyDragonEvent-0.1.0-build30.jar
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "TownyDragonEvent 0.1.0-build30" \
              --generate-notes
          fi
