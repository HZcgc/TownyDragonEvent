name: Build TownyDragonEvent

on:
  push:
    branches: [ main ]
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: temurin
          cache: maven
      - name: Prepare verified PlaceholderAPI build dependency
        working-directory: ${{ runner.temp }}
        shell: bash
        run: |
          papi_jar="${RUNNER_TEMP}/PlaceholderAPI-2.11.7.jar"
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 60 \
            --output "$papi_jar" \
            https://github.com/PlaceholderAPI/PlaceholderAPI/releases/download/2.11.7/PlaceholderAPI-2.11.7.jar
          echo "f5a4ea718baaab6118cfe8f3983ea3a5660af1ee8572360182a3d1b6dbf2eb5d  $papi_jar" | sha256sum --check -
          mvn -B org.apache.maven.plugins:maven-install-plugin:3.1.3:install-file \
            -Dfile="$papi_jar" -DgroupId=me.clip -DartifactId=placeholderapi \
            -Dversion=2.11.7 -Dpackaging=jar -DgeneratePom=true
      - name: Build and verify
        run: mvn -B clean verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: TownyDragonEvent-build37-Paper-26.2
          path: target/TownyDragonEvent-0.1.0-build37.jar
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.1.0-build37
          JAR: target/TownyDragonEvent-0.1.0-build37.jar
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$JAR" --clobber
          else
            gh release create "$TAG" "$JAR" \
              --title "TownyDragonEvent 0.1.0-build37" \
              --generate-notes
          fi


