name: Build TownyDragonEvent

on:
  push:
    branches:
      - main
      - codex/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - name: Build and verify
        run: mvn -B clean verify
      - name: Upload plugin JAR
        uses: actions/upload-artifact@v4
        with:
          name: TownyDragonEvent-build26
          path: target/TownyDragonEvent-0.1.0-build26.jar
          if-no-files-found: error
